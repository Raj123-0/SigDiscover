name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run Ruff
      run: ruff check sigdiscover/ tests/
    - name: Run Pytest (Core)
      run: pytest tests/ -q

  sigprofiler:
    runs-on: ubuntu-latest
    continue-on-error: true # Marking non-blocking initially per finding instructions
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install full stack
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[sigprofiler,dev]"
    - name: Run Integration Tests
      run: pytest tests/ -q --run-integration || pytest tests/ -q
