[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sigdiscover"
version = "0.2.0"
description = "A complete cancer mutational signature discovery pipeline"
authors = [
    {name = "Raj", email = "raj@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.1.0",
    "scipy>=1.13.1",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "plotly>=5.22.0",
    "SigProfilerExtractor>=1.1.24",
    "SigProfilerAssignment>=0.1.8",
    "SigProfilerMatrixGenerator>=1.2.28",
    "SigProfilerPlotting>=1.3.4",
    "biopython>=1.83",
    "pysam>=0.22.1",
    "click>=8.1.7",
    "tqdm>=4.66.4",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4"
]

[tool.setuptools]
packages = ["sigdiscover"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0"
]

[project.scripts]
sigdiscover = "sigdiscover.cli:cli"

[tool.setuptools]
packages = ["sigdiscover"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ["E501", "BLE001", "DTZ005", "DTZ007", "DTZ901", "S110", "F401"]
